name: CI - Vanilla Bazel

on:
    push:
        branches: [main, 2.x, 3.x]
    pull_request:
        branches: [main, 2.x, 3.x]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    test:
        # Only run on main branch (not PRs) to minimize minutes (billed at 10X and 2X respectively)
        # https://docs.github.com/en/billing/managing-billing-for-github-actions/about-billing-for-github-actions#included-storage-and-minutes
        if: github.ref_name == 'main' || contains(github.head_ref, 'macos') || contains(github.head_ref, 'windows')
        strategy:
            fail-fast: false
            matrix:
                folder:
                    - .
                    - examples
                    - 'e2e/smoke'
                os:
                    # NB: linux testing is on Aspect Workflows
                    - macos-latest
                    - windows-latest
                exclude:
                    # examples are not windows-compatible, e.g. the custom
                    # transpilers in examples/transpiler rely on sandboxing
                    # to hide generated .ts fixtures from `tsc -p`.
                    - folder: examples
                      os: windows-latest
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
              with:
                  bazelisk-cache: true
                  external-cache: true
                  module-root: ${{ matrix.folder }}
            # Writes ~/.aspect/bazelrc, which enables Aspect Cloud for `bazel`
            # on CI. Skipped on Windows, which builds without it.
            - uses: aspect-build/setup-aspect@ebca96eb49ef58c00d4226de8bd3a0813507dd87 # v2026.38.3
              if: matrix.os != 'windows-latest'
              with:
                  aspect-api-token: ${{ secrets.ASPECT_CLOUD_API_TOKEN }}
                  disk-cache: false
                  repository-cache: false
            - run: bazel test //...
              working-directory: ${{ matrix.folder }}

    bats-tests:
        strategy:
            fail-fast: false
            matrix:
                # Only run macos on main branch (not PRs) to minimize minutes, see test job above
                os: ${{ fromJSON((github.ref_name == 'main' || contains(github.head_ref, 'macos')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v3
              with:
                  node-version: 20

            - uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
              with:
                  version: '9.15.9'

            - name: Setup bats
              id: setup-bats
              uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
              with:
                  bats-version: '1.8.2'
                  support-version: '0.3.0'
                  assert-version: '2.1.0'
                  detik-install: false
                  file-install: false

            - name: bats -r .
              working-directory: e2e/test
              env:
                  BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
              run: |
                  echo "import $GITHUB_WORKSPACE/.github/workflows/ci.bazelrc" > .bazelrc
                  bats -r .

    # For branch protection settings, this job provides a "stable" name that can be used to gate PR merges
    # on "all matrix jobs were successful".
    conclusion:
        needs: [test, bats-tests]
        runs-on: ubuntu-latest
        if: always()
        steps:
            - run: |
                  if [[ "${{ needs.bats-tests.result }}" == "success" && ("${{ needs.test.result }}" == "success" || "${{ needs.test.result }}" == "skipped") ]]; then
                    exit 0
                  else
                    exit 1
                  fi
