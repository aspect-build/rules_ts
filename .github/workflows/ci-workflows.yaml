name: CI - Aspect Workflows

on:
    push:
        branches: [main, 2.x, 3.x]
    pull_request:
        branches: [main, 2.x, 3.x]
    workflow_dispatch:

permissions:
    id-token: write

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@c22a8f64fb38f82f59ce809cd7eb9f8ae096da44 # v2026.23.2
              with:
                aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
            - name: Format
              run: aspect format --task-key=format
    buildifier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@c22a8f64fb38f82f59ce809cd7eb9f8ae096da44 # v2026.23.2
              with:
                aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
            - name: Buildifier
              run: aspect buildifier --task-key=buildifier
    test:
        name: test (${{ matrix.workspace.path }}, ${{ matrix.bazel.id }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                workspace:
                - { path: ".", slug: "root" }
                - { path: "examples", slug: "examples" }
                - { path: "e2e/smoke", slug: "e2e-smoke" }
                - { path: "e2e/path_mapping", slug: "e2e-path_mapping" }
                - { path: "e2e/bzlmodules", slug: "e2e-bzlmodules" }
                - { path: "e2e/nested_repos", slug: "e2e-nested_repos" }
                - { path: "e2e/external_dep", slug: "e2e-external_dep" }
                - { path: "e2e/external_dep/app", slug: "e2e-external_dep-app" }
                bazel:
                - { id: "bazel-7", version: "7.x", flags: "" }
                - { id: "bazel-8", version: "8.x", flags: "--bazel-flag=--lockfile_mode=update" }
                - { id: "bazel-9", version: "9.x", flags: "--bazel-flag=--lockfile_mode=update" }
        env:
            USE_BAZEL_VERSION: ${{ matrix.bazel.version }}
        steps:
            - uses: actions/checkout@v6
            - uses: aspect-build/setup-aspect@c22a8f64fb38f82f59ce809cd7eb9f8ae096da44 # v2026.23.2
              with:
                aspect-api-token: ${{ secrets.ASPECT_API_TOKEN }}
            - name: Test
              working-directory: ${{ matrix.workspace.path }}
              run: aspect test --task-key=test-${{ matrix.workspace.slug }}-${{ matrix.bazel.id }} ${{ matrix.bazel.flags }} -- //...
            - name: Optional ./test.sh
              working-directory: ${{ matrix.workspace.path }}
              run: |
                  if [[ -f ./test.sh ]]; then
                      ./test.sh
                  else
                      echo "No test.sh in ${PWD}; skipping"
                  fi
